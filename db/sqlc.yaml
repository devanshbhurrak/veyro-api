version: "3"

# Database configuration
packages:
  - name: db
    path: backend/db/queries
    queries: "*.sql"
    schema: backend/db/migrations
    go_package: "backend/db/queries"

# PostgreSQL configuration
targets:
  - provider: pgx
    out: backend/db/queries
    package: db
    emit_exact_table_names: false
    emit_empty_slices: true
    emit_interface: true
    emit_json_tags: true
    emit_exported_queries: false
    emit_result_slice_pointer: true
    emit_named_parameter: true

# Type overrides for specific PostgreSQL types
types:
  # UUID mapping
  "github.com/jackc/pgx/v5/pgtype":
    - "UUID": "pgtype.UUID"

  # Numeric types for financial data
  "github.com/jackc/pgx/v5/pgtype":
    - "NUMERIC": "pgtype.Numeric"

  # Date/time types
  "github.com/jackc/pgx/v5/pgtype":
    - "TIMESTAMPTZ": "pgtype.Timestamptz"
    - "TIMESTAMP": "pgtype.Timestamp"
    - "DATE": "pgtype.Date"

  # JSONB type
  "github.com/jackc/pgx/v5/pgtype":
    - "JSONB": "pgtype.JSONB"

  # JSON
  "github.com/jackc/pgx/v5/pgtype":
    - "JSON": "pgtype.JSON"

  # BIT
  "github.com/jackc/pgx/v5/pgtype":
    - "BIT": "pgtype.Bit"

  # INT
  "github.com/jackc/pgx/v5/pgtype":
    - "INT": "pgtype.Int4"

  # BIGINT
  "github.com/jackc/pgx/v5/pgtype":
    - "BIGINT": "pgtype.Int8"

  # SMALLINT
  "github.com/jackc/pgx/v5/pgtype":
    - "SMALLINT": "pgtype.Int2"

  # Real
  "github.com/jackc/pgx/v5/pgtype":
    - "REAL": "pgtype.Float4"

  # Double precision
  "github.com/jackc/pgx/v5/pgtype":
    - "DOUBLE PRECISION": "pgtype.Float8"

  # Boolean
  "github.com/jackc/pgx/v5/pgtype":
    - "BOOLEAN": "pgtype.Bool"

  # Text
  "github.com/jackc/pgx/v5/pgtype":
    - "TEXT": "pgtype.Text"

  # Varchar
  "github.com/jackc/pgx/v5/pgtype":
    - "VARCHAR": "pgtype.Varchar"

  # Bytea
  "github.com/jackc/pgx/v5/pgtype":
    - "BYTEA": "pgtype.Bytea"

  # inet
  "github.com/jackc/pgx/v5/pgtype":
    - "INET": "pgtype.Inet"

# Query organization by module
struct:
  # Enable all go tags
  go_tags: ["json", "gorm"]

  # Output format
  output_format: "go"